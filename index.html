<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Couple Spin">
<meta name="theme-color" content="#1e1230">
<title>Couple Spin</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img alt="CoupleGoAI logo"><span>CoupleGoAI</span></div>
    <ol class="steps" aria-label="Progress">
      <li data-n="1" data-step="challenge" class="is-active">Challenge</li>
    </ol>
    <div class="top-actions">
      <button class="btn-ghost btn-icon" id="fullscreenBtn" hidden aria-label="Fullscreen" title="Fullscreen">⛶</button>
      <button class="btn-ghost" id="resetBtn">Reset</button>
    </div>
  </header>

  <main class="stage">
    <section class="screen is-active" id="screen-spin" data-step="challenge">
      <h1 class="title">Spin for your challenge</h1>
      <p class="lead">One spin, one little task for the two of you. Spin the wheel and take on your challenge together.</p>
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <svg id="challengeWheel" viewBox="0 0 600 600" role="img" aria-label="Challenge wheel"></svg>
      </div>
      <button class="app-beta-cta" id="spinChallengeBtn" type="button">
        <span class="app-beta-cta__content">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect>
            <path d="M12 18h.01"></path>
          </svg>
          <span>Spin the wheel</span>
        </span>
      </button>
    </section>

    <section class="screen" id="screen-challenge" data-step="challenge">
      <div class="card">
        <span class="badge" id="chBadge">Quick · 20 seconds</span>
        <h2 class="title" id="chTitle">Mirror Me</h2>
        <p class="lead" id="chText"></p>
        <div class="timer" id="timer">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f48ba6"/><stop offset="1" stop-color="#cc7be8"/>
              </linearGradient>
            </defs>
            <circle class="timer-track" cx="100" cy="100" r="88"/>
            <circle class="timer-ring" id="timerRing" cx="100" cy="100" r="88"/>
          </svg>
          <div class="timer-num" id="timerNum">20</div>
        </div>
        <p class="timer-hint" id="timerHint">Ready? Tap start when you both are.</p>
        <div class="actions">
          <button class="btn-primary" id="chPrimary">Start the timer</button>
          <button class="btn-link" id="chSkip">Skip this one → spin again</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
